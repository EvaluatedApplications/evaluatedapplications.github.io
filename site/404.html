<script>
  // Deep links into the Blazor tools app (/tools/*) have no static file, so GitHub Pages serves this 404.
  // Bounce those into the app's host, preserving the route (rafgraph SPA fallback; base segment = "tools").
  (function (l) {
    if (l.pathname.indexOf('/tools/') === 0) {
      var rest = l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~');
      l.replace(l.protocol + '//' + l.host + '/tools/?/' + rest +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash);
    }
  }(window.location));
</script>
