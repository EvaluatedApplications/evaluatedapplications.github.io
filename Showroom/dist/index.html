<body>
    <div id="app">
        <!-- Real boot sequence, not decoration: every line below is an actual resource this page is
             actually fetching (WASM runtime, compiled DLLs) via Blazor's own loadBootResource hook, and
             the progress bar/percentage are the framework's own real cumulative-bytes figure
             (--blazor-load-percentage[-text], set by the WASM host as it downloads — see boot.css and
             the script at the end of this file). Nothing here is fake flavor text: this genuinely is a
             WebAssembly runtime + compiled binaries landing in your browser tab, not a normal page load.
             Two more real (not decorative) signals cover the gap after that download finishes but before
             the AOT-compiled runtime is actually ready to run — a phase with no fetch event to hang a
             loadBootResource line on: a #boot-phase status line + a WebAssembly.compileStreaming/.compile
             observer (see the script below) narrate the browser's real CPU-bound module-compile step, and
             a CSS-only blinking cursor after the log (boot.css) guarantees visible motion through ANY
             wait regardless of whether a hook exists for it. -->
        <div class="boot">
            <div class="boot-crt">
                <div class="boot-head"><span class="boot-dot" aria-hidden="true"></span>EVALUATED APPLICATIONS <span class="boot-sep">/</span> CLIENT-SIDE RUNTIME</div>
                <div class="boot-sub">no server round-trip from here on — everything below runs in this browser tab.</div>
                <pre class="boot-log" id="boot-log" aria-live="polite"></pre>
                <div class="boot-bar" id="boot-bar"><div class="boot-bar-fill"></div></div>
                <div class="boot-pct"></div>
                <div class="boot-phase" id="boot-phase" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">

    </div>
    <script>
      // client-side file download for The Analyst's CSV export — nothing leaves the device
      window.analystDownload = function (name, text, mime) {
        var blob = new Blob([text], { type: mime || 'text/csv;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = name; document.body.appendChild(a); a.click();
        document.body.removeChild(a); setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      };
    </script>
    <script>
      // Real boot-log narration: observes the ACTUAL resources Blazor's WASM host fetches (runtime,
      // loader, compiled assemblies) via the documented loadBootResource hook, and just logs each one
      // — it never intercepts or replaces the fetch (always returns undefined), so this adds no latency,
      // it's a pure observer running alongside the real download that was going to happen anyway.
      window.__bootLine = (function () {
        var log = document.getElementById('boot-log');
        var seen = 0, cap = 80;
        return function line(cls, text) {
          if (!log) return;
          var el = document.createElement('span');
          el.className = cls ? 'l ' + cls : 'l';
          var p = document.createElement('span'); p.className = 'p'; p.textContent = '>';
          el.appendChild(p);
          el.appendChild(document.createTextNode(' ' + text));
          log.appendChild(el);
          if (++seen > cap) log.removeChild(log.firstChild);
          log.scrollTop = log.scrollHeight;
        };
      })();
      __bootLine('', 'target ' + (window.location.pathname || '/'));
      // REAL WASM MULTITHREADING diagnostic (2026-08-28): reports the two actual facts that decide
      // whether the threaded runtime can init — window.crossOriginIsolated (set by the browser only
      // when coi-serviceworker.js has already taken control of THIS navigation's headers) and
      // navigator.hardwareConcurrency (what the pthread pool sizes itself against). On a page's very
      // first-ever visit this will correctly read "not yet isolated" — coi-serviceworker.js is still
      // mid-registration and this load will self-reload once; on every later visit it should read
      // "isolated" before Blazor.start() below ever runs.
      __bootLine(window.crossOriginIsolated ? 'core' : 'warn',
        'cross-origin isolation: ' + (window.crossOriginIsolated ? 'ACTIVE' : 'not yet active (first visit — page will auto-reload once)') +
        ' · logical CPUs: ' + (navigator.hardwareConcurrency || 'unknown'));
      __bootLine('', 'requesting WebAssembly runtime + compiled binaries…');

      // __bootPhase: a state DISTINCT from --blazor-load-percentage[-text] (the framework's own
      // cumulative-bytes-downloaded figure). Real bytes-downloaded can legitimately sit at/near 100%
      // while the browser is still genuinely compiling the big AOT-compiled dotnet.native.*.wasm
      // module — "fully downloaded" isn't "ready". Only the WebAssembly.compileStreaming/.compile
      // observer below ever calls this with busy=true, so it only shows during that real gap.
      window.__bootPhase = (function () {
        var el = document.getElementById('boot-phase');
        var bar = document.getElementById('boot-bar');
        return function (busy, text) {
          if (el) { el.textContent = text || ''; el.className = 'boot-phase' + (busy ? ' compiling' : ''); }
          if (bar) bar.classList.toggle('busy', !!busy);
        };
      })();

      // Real narration for the one boot phase that has NO fetch event to hang a loadBootResource line
      // on: once the big AOT-compiled dotnet.native.*.wasm module finishes downloading, the browser
      // still has to COMPILE it — genuine, sometimes multi-second CPU work on a slow phone, invisible
      // to loadBootResource because it isn't a fetch at all. Verified against the real shipped
      // dotnet.*.js sources for this exact build (not guessed): the WASM host downloads that module
      // then calls the standard WebAssembly.compileStreaming(response) API (falling back to
      // WebAssembly.compile(bytes) if streaming compile isn't available), and grepping all three
      // shipped runtime files confirms neither API is called anywhere else during boot — so wrapping
      // them targets exactly this one real step. Same contract as loadBootResource: call straight
      // through to the real implementation, add no latency, no behavior change, self-remove after the
      // one call dotnet's own loader makes.
      (function () {
        if (typeof WebAssembly === 'undefined') return;
        var announced = false;
        function wrap(name) {
          var real = WebAssembly[name];
          if (typeof real !== 'function') return;
          WebAssembly[name] = function () {
            WebAssembly[name] = real; // self-restore — dotnet's loader only calls this once per boot
            if (!announced) {
              announced = true;
              __bootLine('core', 'compiling WebAssembly module (native code — real CPU work, can take a few seconds on a phone)…');
              __bootPhase(true, 'still working — compiling WebAssembly module…');
            }
            var t0 = performance.now();
            var result = real.apply(WebAssembly, arguments);
            var finish = function (r) {
              __bootLine('core', 'WebAssembly module compiled (' + Math.round(performance.now() - t0) + 'ms)');
              __bootPhase(false, '');
              return r;
            };
            return result.then(finish, function (e) { finish(); throw e; });
          };
        }
        wrap('compileStreaming');
        wrap('compile');
      })();
    </script>
    <!-- autostart=false so the loadBootResource hook below can be wired in BEFORE Blazor.start() kicks
         off the real download — the very next script tag runs immediately after this one loads (classic
         synchronous <script src>, no event-listener wait), so there's no added latency either way. -->
    <script src="_framework/blazor.webassembly.958z1vx7fr.js" autostart="false"></script>
    <script>
      Blazor.start({
        loadBootResource: function (type, name) {
          var label =
            type === 'dotnetwasm' ? ['core', 'runtime ' + name] :
            type === 'dotnetjs' ? ['core', 'loader ' + name] :
            type === 'globalization' ? ['', 'locale data ' + name] :
            type === 'assembly' ? ['', 'assembly ' + name] : null;
          if (label) __bootLine(label[0], label[1]);
          return undefined; // pure observation — Blazor still fetches this exact resource itself
        }
      }).then(function () { __bootPhase(false, ''); __bootLine('core', 'runtime ready — launching tool'); });
    </script>
