<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Evaluated Applications</title>
  <!-- GitHub Pages has no server-side routing. For a deep link like /analyst it serves this 404,
       which encodes the path into a query and bounces to index.html; the script there restores it
       so the Blazor router can handle it. (rafgraph/spa-github-pages, segmentCount 0 for a user/org site.) -->
  <script>
    (function (l) {
      var segmentCount = 0;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    }(window.location));
  </script>
</head>
<body></body>
</html>
