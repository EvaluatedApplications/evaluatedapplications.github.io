name: Deploy site to Pages

# Assembles the site: static content (site/) at the root, with the Blazor WebAssembly
# tools app copied in under /tools. Content is plain HTML (instant + fully indexable);
# the .NET runtime only loads when a visitor opens a tool.
# One-time setup: Settings -> Pages -> Source = "GitHub Actions".
#
# Showroom/dist/ is a PRE-BUILT, COMMITTED publish output (2026-08-28) -- CI does NOT run
# `dotnet publish` here. This build now runs RunAOTCompilation+PublishTrimmed=true, and AOT's
# Emscripten/native compile step is slow enough that rebuilding it on every push burns real
# CI minutes for no reason when Showroom's own source hasn't changed. Instead: build+publish
# LOCALLY (`dotnet publish Showroom/Showroom.csproj -c Release -o <tmp>`, copy `<tmp>/wwwroot`
# over `Showroom/dist/`) and commit the result whenever Showroom's source actually changes.
# CI just copies the committed dist/ folder into the Pages artifact -- trust the local build,
# don't redo it. THE DISCIPLINE THIS REQUIRES: forgetting to rebuild+recommit dist/ after a
# Showroom source change means the live site silently serves stale tool behavior with no error
# anywhere -- always rebuild dist/ in the same commit as any Showroom/**/*.razor(.css) change.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/tools
          cp -r Showroom/dist/. _site/tools/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
